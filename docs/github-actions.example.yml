name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_analysis:
        description: Run locked R 4.6.0 synthetic analysis (downloads dependencies)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/validate_package.py
  synthetic-analysis:
    if: github.event_name == 'workflow_dispatch' && inputs.run_analysis
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
      - run: python3 tools/run_public_checks.py --setup --workdir test-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-validation
          path: test-output
